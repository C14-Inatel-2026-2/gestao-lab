services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gestao_lab
      POSTGRES_USER: gestao_lab
      POSTGRES_PASSWORD: ${DEPLOY_DB_PASSWORD:?Defina DEPLOY_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gestao_lab -d gestao_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gestao_lab
      SPRING_DATASOURCE_USERNAME: gestao_lab
      SPRING_DATASOURCE_PASSWORD: ${DEPLOY_DB_PASSWORD:?Defina DEPLOY_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
