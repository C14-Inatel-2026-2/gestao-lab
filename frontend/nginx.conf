# Serve a interface e encaminha a API na mesma origem.
#
# Com o navegador falando sempre com este servidor, e nunca direto com o
# backend, nao e preciso configurar CORS no Spring. E o mesmo arranjo do proxy
# do Vite em desenvolvimento, agora valendo tambem em producao.
#
# ${BACKEND_URL} e substituido na inicializacao do container pela propria
# imagem do nginx, a partir da variavel de ambiente de mesmo nome.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # O Vite versiona o nome de cada arquivo, entao cache longo e seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache: e ele que aponta para os arquivos versionados.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass ${BACKEND_URL}/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # A aplicacao nao usa rotas no cliente, mas um caminho desconhecido deve
    # devolver a interface em vez de um 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
