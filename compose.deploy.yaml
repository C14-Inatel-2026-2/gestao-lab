services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/gestaolab.db
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - sqlite_data:/app/data
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # Nome do servico na rede do Compose: o navegador nunca usa esta URL,
      # quem a resolve e o nginx dentro do container.
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  sqlite_data:
