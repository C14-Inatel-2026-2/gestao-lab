# SQLite Datasource Configuration
spring.datasource.url=jdbc:sqlite:gestaolab.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool configuration for SQLite single-writer concurrency
spring.datasource.hikari.maximum-pool-size=1

# Opt in to bootstrap the first administrator using environment-provided credentials.
app.auth.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.auth.initial-admin.name=${INITIAL_ADMIN_NAME:}
app.auth.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.auth.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
